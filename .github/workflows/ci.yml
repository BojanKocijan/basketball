name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run test:run
      - run: npm run build
        env:
          # Any value works for a plain build (nothing here hits the network) — the real
          # sports-training-api URL is set per Netlify deploy context instead (see README).
          VITE_API_URL: https://api.build-only.invalid

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          # The e2e test mocks every request to this origin (see tests/e2e/smoke.spec.ts) --
          # it's never actually resolved over the network, just used as a stable match target.
          VITE_API_URL: https://api.e2e-mock.invalid
      - run: npm run test:e2e
        env:
          CI: true
